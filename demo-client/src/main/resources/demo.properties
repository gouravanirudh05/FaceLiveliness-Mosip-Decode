# Face liveness global parameters for the demo client: the same keys the Registration Client reads from its
# synced global parameters (see FaceLivenessGuard). Per-workflow keys (resident / operator / supervisor) override
# the shared ones; unset keys keep the engine defaults. Override any of them in <demo data folder>/demo.properties,
# with -D<key>=<value>, or live on the Settings screen.

mosip.registration.face.liveness.enable=Y

# Liveness engine (start it with mosip/scripts/start-services.sh)
mosip.registration.face.liveness.service.host=127.0.0.1
mosip.registration.face.liveness.service.port=50052
mosip.registration.face.liveness.service.autostart=N
mosip.registration.face.liveness.engine.error.policy=DENY

# Shared policy
mosip.registration.face.liveness.passive.threshold=0.80
mosip.registration.face.liveness.passive.reject.threshold=0.40
mosip.registration.face.liveness.active.enable=Y
mosip.registration.face.liveness.active.challenge.types=blink,smile,open_mouth,turn_left,turn_right,nod
mosip.registration.face.liveness.active.challenge.timeout.seconds=8,6,5
mosip.registration.face.liveness.active.max.retries=2
mosip.registration.face.liveness.repeated.failure.max.sessions=3
mosip.registration.face.liveness.repeated.failure.action=BLOCK

# Resident registration
mosip.registration.face.liveness.resident.active.min.challenges=2

# Operator login / authentication: fewer steps, operators authenticate many times a day
mosip.registration.face.liveness.operator.active.min.challenges=1

# Supervisor authentication: stricter, proves physical presence
mosip.registration.face.liveness.supervisor.passive.threshold=0.90
mosip.registration.face.liveness.supervisor.active.min.challenges=2
